# =====================================================
# KosKu Solo — Jaga Supabase tetap aktif
# Supabase paket gratis mem-pause proyek yang tidak dipakai ±7 hari.
# Workflow ini "mengetuk" database setiap hari supaya tidak ter-pause.
# Simpan di: .github/workflows/keep-alive.yml
# =====================================================

name: Jaga Supabase Aktif

on:
  schedule:
    - cron: '0 1 * * *'   # setiap hari jam 08.00 WIB
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ketuk database Supabase
        env:
          SUPABASE_URL: https://kyytbtkeivjzfzxgzzdm.supabase.co
          SUPABASE_KEY: sb_publishable_czOkAsxCHGfXYgabjRPoPA_zNkv3OrH
        run: |
          echo "Menghubungi Supabase..."
          curl -sS -f --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/kos?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
          echo ""
          echo "Berhasil. Supabase tetap aktif."
